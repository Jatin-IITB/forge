[project]
name = "forge"
version = "0.0.1"
description = "Task-specialization distillation pipeline — manufacture a verified small specialist that matches a teacher within tolerance at 10-100x lower cost."
readme = "README.md"
requires-python = ">=3.10"
# Phase 0 ships only contract + schema, so deps are intentionally tiny.
# Modelling deps (torch, transformers, peft, trl, vllm, outlines) arrive in Phase 2+.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # forge/ci.py builds every published confidence interval and is imported by
    # scripts/run_eval.py --ci. It was undeclared until 2026-09-04, so a fresh
    # `make install` produced a venv where tests could not even be collected.
    "numpy>=1.26",
]

[project.optional-dependencies]
data = [
    "faker>=24.0",   # MIT — synthetic PII values for the gold/train builder
]
infer = [
    "openai>=1.0",   # OpenAI-compatible API client for vLLM / Ollama / etc.
]
train = [
    "torch>=2.1",
    "transformers>=4.40",
    "peft>=0.10",
    "trl>=0.8",
    "datasets>=2.18",
    "accelerate>=0.28",
    "bitsandbytes>=0.43",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
