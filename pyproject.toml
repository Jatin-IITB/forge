[project]
name = "forge"
version = "0.0.1"
description = "Task-specialization distillation pipeline — manufacture a verified small specialist that matches a teacher within tolerance at 10-100x lower cost."
readme = "README.md"
requires-python = ">=3.10"
# Phase 0 ships only contract + schema, so deps are intentionally tiny.
# Modelling deps (torch, transformers, peft, trl, vllm, outlines) arrive in Phase 2+.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # forge/ci.py builds every published confidence interval and is imported by
    # scripts/run_eval.py --ci. It was undeclared until 2026-09-04, so a fresh
    # `make install` produced a venv where tests could not even be collected.
    "numpy>=1.26",
]

[project.optional-dependencies]
data = [
    # MIT — synthetic PII values for the gold/train builder.
    #
    # The ceiling is NOT cosmetic. This was an unbounded `faker>=24.0` until
    # 2026-09-07, when `test_gold_builder.py::test_reproducibility` was found
    # failing: a fresh build differs from the committed gold set in 116/385
    # records. Faker's provider data (name/email/IP pools) changes between
    # releases, so the same seed yields different values while the RNG stream
    # stays aligned -- which is why 267 records after the first difference are
    # still byte-identical, and why this is not a cascade.
    #
    # HONEST LIMIT: this bound stops further silent drift; it does NOT restore
    # reproducibility. ~25 versions were bisected in an isolated install
    # (15.0 -> 40.38.0) and the diff count sits in three plateaus -- 283 (<=27.1),
    # 123 (27.2-39.x), 116 (all of 40.x) -- never reaching zero. NO available
    # Faker rebuilds the committed bytes. The gold set is therefore a committed
    # artifact, verifiable by hash but not regenerable, and the contract forbids
    # regenerating it to make the test pass. See NORTH_STAR row 6(c).
    "faker>=24.0,<41",
]
infer = [
    "openai>=1.0",   # OpenAI-compatible API client for vLLM / Ollama / etc.
]
train = [
    # transformers is pinned <5, and the reason is worth recording because the
    # first attempt at this bound was wrong.
    #
    # An unbounded `transformers>=4.40` resolved to 5.16.1 on a fresh Windows
    # install. `tests/test_token_classifier.py` passed 9/9 there, so the ceiling
    # was first set to <6 on the strength of that. But those tests exercise BIOES
    # alignment and a forward pass — they never construct `TrainingArguments`,
    # which is where v5 actually breaks:
    #
    #     TypeError: TrainingArguments.__init__() got an unexpected keyword
    #                argument 'warmup_ratio'
    #
    # The trainer passes ~20 kwargs that v5 refactored; warmup_ratio is simply
    # the first to fail. A green test suite was not evidence about the code path
    # that matters, and the bound is now set from a real training run instead.
    "torch>=2.1",
    "transformers>=4.40,<5",
    "peft>=0.10,<1",
    "trl>=0.8,<2",
    "datasets>=2.18",
    "accelerate>=0.28",
    "bitsandbytes>=0.43",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
