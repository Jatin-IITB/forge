[project]
name = "forge"
version = "0.0.1"
description = "Task-specialization distillation pipeline — manufacture a verified small specialist that matches a teacher within tolerance at 10-100x lower cost."
readme = "README.md"
requires-python = ">=3.10"
# Phase 0 ships only contract + schema, so deps are intentionally tiny.
# Modelling deps (torch, transformers, peft, trl, vllm, outlines) arrive in Phase 2+.
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # forge/ci.py builds every published confidence interval and is imported by
    # scripts/run_eval.py --ci. It was undeclared until 2026-09-04, so a fresh
    # `make install` produced a venv where tests could not even be collected.
    "numpy>=1.26",
]

[project.optional-dependencies]
data = [
    "faker>=24.0",   # MIT — synthetic PII values for the gold/train builder
]
infer = [
    "openai>=1.0",   # OpenAI-compatible API client for vLLM / Ollama / etc.
]
train = [
    # Upper bounds added 2026-09-05. An unbounded `transformers>=4.40` resolved
    # to 5.16.1 on a fresh Windows install — a major version this code had never
    # met, because the Mac venv is eval-only and carries no transformers at all.
    # It turned out to work (9/9 token-classifier tests pass on 5.16.1 with
    # torch 2.11.0+cu128), so the ceilings sit *above* the tested version rather
    # than below it. The point is that the range is now exercised, not open.
    "torch>=2.1",
    "transformers>=4.40,<6",
    "peft>=0.10,<1",
    "trl>=0.8,<2",
    "datasets>=2.18",
    "accelerate>=0.28",
    "bitsandbytes>=0.43",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
